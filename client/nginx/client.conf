# ============================================================================
# Client Nginx 配置 — 前端静态资源服务
#
# 职责：服务 Vite 构建产物（dist），SPA history 模式 fallback
# 反向代理由根级 nginx 容器统一处理，此处仅服务静态文件
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml;

    # 静态资源缓存（带 hash 的文件长期缓存，index.html 不缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # favicon 等根级静态文件
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html 禁止缓存（确保用户拿到最新版本）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA history 模式 fallback：所有未匹配的路由返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
