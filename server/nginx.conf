# ============================================================================
# Nginx 网关配置 — 反向代理 + 负载均衡 + 安全加固
#
# 拓扑：
#   客户端 → nginx(:80) ──┬── /api/  → upstream cms-server (多实例)
#                         ├── /admin → upstream cms-frontend-manage
#                         └── /      → upstream cms-frontend-web
#
# 安全特性：HSTS、CSP、X-Frame-Options、隐藏版本号、限速
# 性能特性：gzip、静态资源缓存、keepalive、proxy_next_upstream 容错
# ============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── 基础优化 ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    server_tokens off; # 隐藏 nginx 版本号
    client_max_body_size 20m; # 允许文件上传（与 bodyparser 配置对齐）

    # ── gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── 限速：防止单个 IP 恶意消耗带宽 ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # ── 上游服务：后端 API（多实例负载均衡） ──
    upstream cms-server-node {
        # 多实例负载均衡（PM2 cluster 已在单容器内多进程，此处为多容器横向扩展预留）
        server cms-server:8080 max_fails=3 fail_timeout=30s;

        # 容错：当实例返回 5xx/超时时自动切换
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # 长连接复用（减少 TCP 握手开销）
        keepalive 32;
    }

    # ── 上游服务：前端管理后台 ──
    upstream cms-frontend-manage {
        server cms-client:80 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── 上游服务：前端门户（预留，当前与管理后台同源） ──
    upstream cms-frontend-web {
        server cms-client:80 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── HTTP → HTTPS 重定向（生产环境启用 HTTPS 后取消注释） ──
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        server_name _;

        # ── 安全响应头 ──
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # HSTS（仅在 HTTPS 下生效，HTTP 下浏览器会忽略）
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── API 反向代理 ──
        location /api/ {
            limit_req zone=api burst=40 nodelay;

            proxy_pass http://cms-server-node;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时配置（与后端 DB/Redis 超时对齐）
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 去掉 /api 前缀
            rewrite ^/api/(.*)$ /$1 break;
        }

        # ── 管理后台 ──
        location /admin {
            proxy_pass http://cms-frontend-manage/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 前端门户（默认路由） ──
        location / {
            proxy_pass http://cms-frontend-web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 健康检查端点（供 Docker HEALTHCHECK / k8s liveness 使用） ──
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
